[lilygo_twatch_ultra]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.partitions = variants/lilygo_twatch_ultra/partitions.csv
build_flags = ${esp32_base.build_flags}
  -I variants/lilygo_twatch_ultra
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D PIN_BOARD_SDA=3
  -D PIN_BOARD_SCL=2
  -D P_LORA_MOSI=34
  -D P_LORA_MISO=33
  -D P_LORA_SCLK=35
  -D P_LORA_NSS=36
  -D P_LORA_RESET=47
  -D P_LORA_BUSY=48
  -D P_LORA_DIO_1=14
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.6
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_twatch_ultra>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  lewisxhe/XPowersLib @ 0.2.7

[twatch_ultra_companion]
extends = lilygo_twatch_ultra
build_flags = ${lilygo_twatch_ultra.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${lilygo_twatch_ultra.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${lilygo_twatch_ultra.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:lilygo_twatch_ultra_companion_radio_usb]
extends = twatch_ultra_companion
build_flags = ${twatch_ultra_companion.build_flags}
  -D ENABLE_USB_INTERFACE

[env:lilygo_twatch_ultra_companion_radio_ble]
extends = twatch_ultra_companion
build_flags = ${twatch_ultra_companion.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${twatch_ultra_companion.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

[env:lilygo_twatch_ultra_repeater]
extends = lilygo_twatch_ultra
; ESPAsyncWebServer also declares TCP libraries for other platforms.
lib_compat_mode = strict
build_flags = ${lilygo_twatch_ultra.build_flags}
  -D ADVERT_NAME='"T-Watch Ultra Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${lilygo_twatch_ultra.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${lilygo_twatch_ultra.lib_deps}
  ${esp32_ota.lib_deps}
